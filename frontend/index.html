<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GetLuck</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:#111827;
        }

        .container{
            width:350px;
            background:#1f2937;
            padding:30px;
            border-radius:12px;
            box-shadow:0 0 20px rgba(0,0,0,0.3);
        }

        h1{
            color:white;
            text-align:center;
            margin-bottom:25px;
        }

        .input-box{
            width:100%;
            padding:12px;
            margin-bottom:15px;
            border:none;
            border-radius:8px;
            outline:none;
            font-size:15px;
        }

        .btn{
            width:100%;
            padding:12px;
            border:none;
            border-radius:8px;
            background:#2563eb;
            color:white;
            font-size:16px;
            cursor:pointer;
            transition:0.3s;
        }

        .btn:hover{
            background:#1d4ed8;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>GetLuck</h1>

        <input
            type="text"
            id="username"
            class="input-box"
            placeholder="Username"
        >

        <input
            type="password"
            id="password"
            class="input-box"
            placeholder="Password"
        >

        <button class="btn" id="enterBtn">
            Enter
        </button>
    </div>

    <script>
        document.getElementById("enterBtn").addEventListener("click", async () => {

            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            const response = await fetch("/submit", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    username,
                    password
                })
            });

            const data = await response.json();

            alert(data.message);
        });
    </script>

</body>
</html>
